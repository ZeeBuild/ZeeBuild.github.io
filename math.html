<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A timed addition and subtraction game with an on-screen numpad and high scores." />
  <title>Math — Zee Site</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #4c8dff;
      --border: #30363d;
      --good: #3fb950;
      --bad: #f85149;
      --tens: #58a6ff;
      --ones: #e3b341;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      padding: 1.5rem;
    }

    .brand { text-decoration: none; color: var(--text); font-weight: 700; font-size: 1.1rem; }
    .brand span { color: var(--accent); }
    .game-nav { display: flex; gap: 1.25rem; }
    .game-nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
    .game-nav a:hover { color: var(--text); }

    .hud {
      display: flex;
      gap: 2.5rem;
      font-variant-numeric: tabular-nums;
    }
    .hud .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .hud .value { font-size: 1.3rem; font-weight: 700; }
    .hud .best-cell { text-align: center; }
    .reset-best {
      display: block;
      margin: 0.15rem auto 0;
      padding: 0.15rem 0.5rem;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .reset-best:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }

    .timebar { width: 100%; max-width: 420px; height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .timebar-fill { height: 100%; width: 100%; background: var(--accent); transition: width 0.2s linear; }

    .setup {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .setup-label { color: var(--muted); font-size: 0.85rem; }
    .presets { display: flex; gap: 0.4rem; }

    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 0.9rem;
      border-radius: var(--radius);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .preset.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; padding-inline: 1.6rem; }

    .board-wrap { position: relative; width: 100%; max-width: 420px; }
    .main-col { display: flex; flex-direction: column; gap: 0.9rem; min-width: 0; }

    .game {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .question {
      text-align: center;
      font-size: 2.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      padding: 0.4rem 0;
    }
    .question.vertical {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: max-content;
      margin-inline: auto;
      line-height: 1.1;
      padding: 0;
    }
    .question.vertical .v-row { padding-right: 0.35rem; }
    .question.vertical .v-rule { width: 100%; height: 2px; background: var(--text); margin: 0.15rem 0; }

    .answer-row { display: flex; gap: 0.6rem; }
    .answer {
      flex: 1;
      min-height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .answer.empty { color: var(--muted); font-weight: 400; }
    .check { min-width: 6.5rem; }

    .feedback { text-align: center; min-height: 1.3rem; font-size: 0.9rem; color: var(--muted); }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }

    .work {
      border-top: 1px solid var(--border);
      padding-top: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      text-align: left;
    }
    .work h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .break-diagram { display: flex; flex-direction: column; gap: 0.75rem; }
    .break-equation {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .break-term { display: flex; flex-direction: column; align-items: center; min-width: 5.6rem; }
    .break-term .num { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .break-term .num.whole { color: var(--text); }
    .break-term .num.split { color: var(--accent); }
    .break-op { font-size: 1.3rem; color: var(--muted); padding-top: 0.1rem; }
    .break-result { font-size: 1.4rem; font-weight: 700; color: var(--good); padding-top: 0.1rem; font-variant-numeric: tabular-nums; }
    .bond {
      width: 100%;
      height: 16px;
      position: relative;
      margin-top: 2px;
    }
    .bond .stem { position: absolute; left: 50%; top: 0; width: 2px; height: 8px; background: var(--border); }
    .bond .bar { position: absolute; left: 24%; right: 24%; top: 8px; height: 2px; background: var(--border); }
    .bond .leg { position: absolute; top: 8px; width: 2px; height: 8px; background: var(--border); }
    .bond .leg.left { left: 24%; }
    .bond .leg.right { right: 24%; }
    .break-boxes { display: flex; gap: 0.45rem; width: 100%; }
    .break-box {
      flex: 1;
      min-width: 0;
      text-align: center;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 0.3rem 0.15rem;
    }
    .break-box.tens { border-color: var(--tens); }
    .break-box.ones { border-color: var(--ones); }
    .break-box b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .break-box.tens b { color: var(--tens); }
    .break-box.ones b { color: var(--ones); }
    .break-box small { display: block; color: var(--muted); font-size: 0.55rem; letter-spacing: 0.08em; }
    .break-steps { display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
    .break-steps .line { display: flex; gap: 0.5rem; align-items: baseline; color: var(--muted); }
    .break-steps .line .tag { min-width: 3.4rem; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .break-steps .line.tens-line .eq { color: var(--tens); }
    .break-steps .line.ones-line .eq { color: var(--ones); }
    .break-steps .line.final { color: var(--text); font-weight: 700; }
    .break-steps .line.final .eq { color: var(--good); }
    .break-steps .note { font-size: 0.8rem; color: var(--muted); padding-left: 3.9rem; }
    .nl-svg { display: block; width: 100%; height: auto; }
    .nl-base, .nl-tick { stroke: var(--border); stroke-width: 2; }
    .nl-tick { stroke-width: 1.5; }
    .nl-dot { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
    .nl-dot.end { fill: var(--accent); }
    .nl-label { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .nl-label.end { fill: var(--accent); font-weight: 700; }
    .nl-arc { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .nl-arrow { fill: var(--border); }
    .nl-jump { fill: var(--text); font-size: 10px; text-anchor: middle; }
    .work-summary { color: var(--muted); font-size: 0.85rem; }
    .work .next { align-self: center; }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    .numpad button { height: 3.2rem; font-size: 1.1rem; }
    .numpad .fn { color: var(--muted); font-size: 1rem; }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      border-radius: var(--radius);
      text-align: center;
      padding: 1rem;
    }
    .overlay h2 { font-size: 1.6rem; }
    .overlay p { color: var(--muted); }
    .overlay-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }

    /* Desktop: two-column layout to avoid vertical scrolling on 1080p */
    @media (min-width: 900px) {
      body { padding: 0.75rem 1rem; gap: 0.6rem; }
      .timebar { max-width: 900px; }
      .board-wrap { max-width: 900px; }
      .game { flex-direction: row; align-items: flex-start; gap: 1.25rem; padding: 1rem 1.25rem; }
      .main-col { flex: 1 1 0; gap: 0.6rem; }
      .work {
        flex: 0 0 420px;
        max-width: 420px;
        border-top: none;
        border-left: 1px solid var(--border);
        padding-top: 0;
        padding-left: 1.25rem;
        padding-right: 0;
      }
      .question { font-size: 2rem; padding: 0.2rem 0; }
      .numpad button { height: 2.8rem; }
      .answer { min-height: 2.6rem; font-size: 1.4rem; }
    }

  </style>
</head>
<body>
  <a class="brand" href="index.html">Zee<span> Site</span> / Math</a>
  <nav class="game-nav">
    <a href="snake.html">Snake</a>
    <a href="plates.html">Plates</a>
    <a href="plates-canada.html">Canada</a>
  </nav>

  <div class="hud">
    <div><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="best-cell">
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
      <button type="button" id="resetBestBtn" class="reset-best" title="Reset best score" aria-label="Reset best score">Reset</button>
    </div>
    <div><div class="label">Time</div><div class="value" id="time">60</div></div>
  </div>

  <div class="timebar" id="timebar" aria-hidden="true"><div class="timebar-fill" id="timeFill"></div></div>

  <div class="setup">
    <span class="setup-label">Round length</span>
    <div class="presets" id="presets" role="group" aria-label="Round length">
      <button type="button" class="preset selected" data-seconds="0" aria-pressed="true">Practice</button>
      <button type="button" class="preset" data-seconds="60" aria-pressed="false">1 min</button>
      <button type="button" class="preset" data-seconds="120" aria-pressed="false">2 min</button>
      <button type="button" class="preset" data-seconds="300" aria-pressed="false">5 min</button>
    </div>
    <button type="button" id="startBtn" class="primary">Start</button>
    <span class="setup-label">Equation</span>
    <button type="button" id="layoutBtn" class="preset" aria-pressed="false" aria-label="Show equations vertically">Vertical</button>
  </div>

  <div class="board-wrap">
    <section class="game" id="game" aria-label="Math game">
      <div class="main-col">
        <div class="question" id="question" aria-live="polite">&#8212; + &#8212; = ?</div>

        <div class="answer-row">
          <div class="answer empty" id="answer" aria-label="Your answer">&#8212;</div>
          <button type="button" id="checkBtn" class="check">Check &#8629;</button>
        </div>

        <p class="feedback" id="feedback" aria-live="polite">Choose a round length and press Start.</p>

        <div class="numpad" id="numpad">
          <button type="button" data-key="1" aria-label="Digit 1">1</button>
          <button type="button" data-key="2" aria-label="Digit 2">2</button>
          <button type="button" data-key="3" aria-label="Digit 3">3</button>
          <button type="button" data-key="4" aria-label="Digit 4">4</button>
          <button type="button" data-key="5" aria-label="Digit 5">5</button>
          <button type="button" data-key="6" aria-label="Digit 6">6</button>
          <button type="button" data-key="7" aria-label="Digit 7">7</button>
          <button type="button" data-key="8" aria-label="Digit 8">8</button>
          <button type="button" data-key="9" aria-label="Digit 9">9</button>
          <button type="button" class="fn" data-key="clear" aria-label="Clear answer">C</button>
          <button type="button" data-key="0" aria-label="Digit 0">0</button>
          <button type="button" class="fn" data-key="back" aria-label="Backspace">&#9003;</button>
        </div>
      </div>

      <div class="work" id="work" hidden>
        <div>
          <h3>Break apart</h3>
          <div class="steps" id="workSteps"></div>
        </div>
        <div>
          <h3>Number line</h3>
          <div class="number-line" id="workLine"></div>
          <div class="work-summary" id="workSummary"></div>
        </div>
        <button type="button" id="nextBtn" class="primary next">Next question</button>
      </div>
    </section>

    <div class="overlay" id="overlay" hidden>
      <h2 id="overlayTitle">Time's up!</h2>
      <p id="overlayText">Score: 0 &middot; Best: 0</p>
      <div class="overlay-actions">
        <button type="button" id="againBtn" class="primary">Play again</button>
        <button type="button" id="stopBtn">Stop</button>
      </div>
    </div>
  </div>


  <script>
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const timeEl = document.getElementById('time');
    const timebarEl = document.getElementById('timebar');
    const timeFill = document.getElementById('timeFill');
    const presetsEl = document.getElementById('presets');
    const startBtn = document.getElementById('startBtn');
    const layoutBtn = document.getElementById('layoutBtn');
    const questionEl = document.getElementById('question');
    const answerEl = document.getElementById('answer');
    const checkBtn = document.getElementById('checkBtn');
    const feedbackEl = document.getElementById('feedback');
    const workEl = document.getElementById('work');
    const workStepsEl = document.getElementById('workSteps');
    const workLineEl = document.getElementById('workLine');
    const workSummaryEl = document.getElementById('workSummary');
    const nextBtn = document.getElementById('nextBtn');
    const numpadEl = document.getElementById('numpad');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const againBtn = document.getElementById('againBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBestBtn = document.getElementById('resetBestBtn');

    let best = 0;
    try {
      const stored = Number(localStorage.getItem('math-best') || 0);
      if (Number.isFinite(stored) && stored >= 0) best = stored;
    } catch (e) { /* storage unavailable */ }

    let roundSeconds = 0;
    let secondsLeft = 0;
    let score = 0;
    let running = false;
    let answer = '';
    let current = null;
    let lastKey = '';
    let deadline = 0;
    let timerId = null;
    let vertical = false;
    let showingWork = false;

    function updateHud() {
      scoreEl.textContent = score;
      bestEl.textContent = best;
      const untimed = roundSeconds === 0;
      timeEl.textContent = untimed ? '\u221E' : secondsLeft;
      timebarEl.hidden = untimed;
      if (!untimed) timeFill.style.width = (secondsLeft / roundSeconds * 100) + '%';
    }

    function selectPreset(seconds) {
      if (running) return;
      roundSeconds = seconds;
      secondsLeft = seconds;
      presetsEl.querySelectorAll('.preset').forEach((b) => {
        const on = Number(b.dataset.seconds) === seconds;
        b.classList.toggle('selected', on);
        b.setAttribute('aria-pressed', String(on));
      });
      updateHud();
    }

    function setFeedback(message, tone) {
      feedbackEl.textContent = message;
      feedbackEl.className = 'feedback' + (tone ? ' ' + tone : '');
    }

    function renderQuestion() {
      questionEl.classList.toggle('vertical', vertical && !!current);
      if (!current) {
        questionEl.textContent = '\u2014 + \u2014 = ?';
      } else if (vertical) {
        questionEl.innerHTML = '<span class="v-row">' + current.a + '</span>' +
          '<span class="v-row">' + current.op + ' ' + current.b + '</span>' +
          '<span class="v-rule"></span>' +
          '<span class="v-row">?</span>';
      } else {
        questionEl.textContent = current.a + ' ' + current.op + ' ' + current.b + ' = ?';
      }
    }

    function generateQuestion() {
      let q, key, tries = 0;
      do {
        const op = Math.random() < 0.5 ? '+' : '\u2212';
        let a = 10 + Math.floor(Math.random() * 90);
        let b;
        if (op === '+') {
          // Keep both operands two-digit and cap the sum at 109.
          b = 10 + Math.floor(Math.random() * (100 - a));
        } else {
          b = 10 + Math.floor(Math.random() * 90);
          if (a < b) { const t = a; a = b; b = t; }
        }
        q = { a: a, b: b, op: op, result: op === '+' ? a + b : a - b };
        key = a + op + b;
        tries++;
      } while (key === lastKey && tries < 10);
      lastKey = key;
      current = q;
      renderQuestion();
    }

    function clearAnswer() {
      answer = '';
      answerEl.textContent = '\u2014';
      answerEl.classList.add('empty');
    }

    function appendDigit(digit) {
      if (!running || showingWork || answer.length >= 3) return;
      answer += digit;
      answerEl.textContent = answer;
      answerEl.classList.remove('empty');
    }

    function backspace() {
      if (!running || showingWork) return;
      answer = answer.slice(0, -1);
      answerEl.textContent = answer || '\u2014';
      answerEl.classList.toggle('empty', answer === '');
    }

    function partsOf(n) {
      return { tens: Math.floor(n / 10) * 10, ones: n % 10 };
    }

    function workRow(text) {
      const row = document.createElement('div');
      row.className = 'line';
      row.textContent = text;
      return row;
    }

    function breakBoxes(parts) {
      const bond = document.createElement('div');
      bond.className = 'bond';
      ['stem', 'bar', 'leg left', 'leg right'].forEach((cls) => {
        const el = document.createElement('span');
        el.className = cls;
        bond.appendChild(el);
      });
      const boxes = document.createElement('div');
      boxes.className = 'break-boxes';
      [['tens', parts.tens, 'TENS'], ['ones', parts.ones, 'ONES']].forEach(([kind, value, label]) => {
        const box = document.createElement('div');
        box.className = 'break-box ' + kind;
        const b = document.createElement('b');
        b.textContent = value;
        const small = document.createElement('small');
        small.textContent = label;
        box.appendChild(b);
        box.appendChild(small);
        boxes.appendChild(box);
      });
      return [bond, boxes];
    }

    function breakTerm(number, parts) {
      const term = document.createElement('div');
      term.className = 'break-term';
      const num = document.createElement('span');
      num.className = 'num ' + (parts ? 'split' : 'whole');
      num.textContent = number;
      term.appendChild(num);
      if (parts) breakBoxes(parts).forEach((el) => term.appendChild(el));
      return term;
    }

    function breakStep(tag, text, cls) {
      const line = document.createElement('div');
      line.className = 'line' + (cls ? ' ' + cls : '');
      const tagEl = document.createElement('span');
      tagEl.className = 'tag';
      tagEl.textContent = tag;
      const eq = document.createElement('span');
      eq.className = 'eq';
      eq.textContent = text;
      line.appendChild(tagEl);
      line.appendChild(eq);
      return line;
    }

    function renderNumberLine(start, jumps, sign, end) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 400 140');
      svg.setAttribute('class', 'nl-svg');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'Open number line from ' + start + ' to ' + end);
      const add = (tag, attrs, text) => {
        const el = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, String(v)));
        if (text !== undefined) el.textContent = text;
        svg.appendChild(el);
        return el;
      };

      const count = jumps.length;
      const pad = 36;
      const base = 100;
      const reverse = sign === '\u2212';
      const unit = count ? (400 - pad * 2) / count : 0;
      const widths = jumps.map((j) => j === 10 ? 1 : 0.5);
      const total = widths.reduce((sum, w) => sum + w, 0) * unit;
      const left = (400 - total) / 2;
      const xs = [reverse ? left + total : left];
      for (let i = 0; i < count; i++) {
        xs.push(xs[i] + (reverse ? -1 : 1) * widths[i] * unit);
      }
      const minX = Math.min.apply(null, xs);
      const maxX = Math.max.apply(null, xs);

      add('line', { x1: minX - 20, y1: base, x2: maxX + 12, y2: base, class: 'nl-base' });
      const tip = reverse ? minX - 18 : maxX + 18;
      const back = reverse ? minX - 9 : maxX + 9;
      add('polygon', {
        points: tip + ',' + base + ' ' + back + ',' + (base - 5) + ' ' + back + ',' + (base + 5),
        class: 'nl-arrow'
      });

      let value = start;
      for (let i = 0; i <= count; i++) {
        const x = xs[i];
        const last = i === count;
        add('line', { x1: x, y1: base - 6, x2: x, y2: base + 6, class: 'nl-tick' });
        add('circle', { cx: x, cy: base, r: 4, class: 'nl-dot' + (last ? ' end' : '') });
        add('text', { x: x, y: 124, class: 'nl-label' + (last ? ' end' : ''), 'text-anchor': 'middle' }, String(value));
        if (i < count) {
          const nx = xs[i + 1];
          const bigJump = jumps[i] === 10;
          const lift = bigJump ? (i % 2 === 0 ? 42 : 60) : (i % 2 === 0 ? 9 : 12);
          add('path', {
            d: 'M ' + x + ' ' + base + ' C ' + x + ' ' + (base - lift) + ', ' + nx + ' ' + (base - lift) + ', ' + nx + ' ' + base,
            class: 'nl-arc'
          });
          add('text', { x: (x + nx) / 2, y: base - lift + (bigJump ? 4 : -4), class: 'nl-jump' }, sign + jumps[i]);
          value += sign === '+' ? jumps[i] : -jumps[i];
        }
      }

      workLineEl.replaceChildren(svg);
    }

    function renderWork() {
      const { a, b, op, result } = current;
      const aParts = partsOf(a);
      const bParts = partsOf(b);
      const jumps = [];
      for (let t = 0; t < bParts.tens / 10; t++) jumps.push(10);
      for (let o = 0; o < bParts.ones; o++) jumps.push(1);
      const sign = op === '+' ? '+' : '\u2212';

      workStepsEl.className = 'break-diagram';
      workStepsEl.replaceChildren();

      const equation = document.createElement('div');
      equation.className = 'break-equation';
      equation.appendChild(breakTerm(a, op === '+' ? aParts : null));
      const opEl = document.createElement('span');
      opEl.className = 'break-op';
      opEl.textContent = sign;
      equation.appendChild(opEl);
      equation.appendChild(breakTerm(b, bParts));
      const equalsEl = document.createElement('span');
      equalsEl.className = 'break-op';
      equalsEl.textContent = '=';
      equation.appendChild(equalsEl);
      const resultEl = document.createElement('span');
      resultEl.className = 'break-result';
      resultEl.textContent = result;
      equation.appendChild(resultEl);
      workStepsEl.appendChild(equation);

      const steps = document.createElement('div');
      steps.className = 'break-steps';
      if (op === '+') {
        const tensSum = aParts.tens + bParts.tens;
        const onesSum = aParts.ones + bParts.ones;
        steps.appendChild(breakStep('Tens', aParts.tens + ' + ' + bParts.tens + ' = ' + tensSum, 'tens-line'));
        steps.appendChild(breakStep('Ones', aParts.ones + ' + ' + bParts.ones + ' = ' + onesSum, 'ones-line'));
        if (onesSum >= 10) {
          steps.appendChild(breakStep('Regroup', onesSum + ' = 10 + ' + (onesSum - 10), 'ones-line'));
          steps.appendChild(breakStep('Final', tensSum + ' + ' + onesSum + ' = ' + result, 'final'));
          const note = document.createElement('div');
          note.className = 'note';
          note.textContent = tensSum + ' + 10 = ' + (tensSum + 10) + ', then + ' + (onesSum - 10) + ' = ' + result;
          steps.appendChild(note);
        } else {
          steps.appendChild(breakStep('Final', tensSum + ' + ' + onesSum + ' = ' + result, 'final'));
        }
      } else {
        const middle = a - bParts.tens;
        steps.appendChild(breakStep('Break', b + ' = ' + bParts.tens + ' + ' + bParts.ones));
        steps.appendChild(breakStep('Tens', a + ' \u2212 ' + bParts.tens + ' = ' + middle, 'tens-line'));
        steps.appendChild(breakStep('Ones', middle + ' \u2212 ' + bParts.ones + ' = ' + result, 'final'));
      }
      workStepsEl.appendChild(steps);

      renderNumberLine(a, jumps, sign, result);
      workSummaryEl.textContent = a + ' ' + op + ' ' + b + ' = ' + result;
    }

    function setWorkVisible(visible) {
      showingWork = visible;
      workEl.hidden = !visible;
      checkBtn.disabled = visible;
      numpadEl.querySelectorAll('button').forEach((b) => { b.disabled = visible; });
    }

    function showWork() {
      renderWork();
      setWorkVisible(true);
      nextBtn.focus();
    }

    function nextQuestion() {
      setWorkVisible(false);
      clearAnswer();
      generateQuestion();
      setFeedback('Go!');
    }

    // Fun emojis for the green "correct" message. Shark, dino and fireworks
    // are the priority picks, so they turn up more often than the rest.
    const priorityEmojis = ['🦈', '🦖', '🎆'];
    const funEmojis = ['🎉', '⭐', '🏆', '🚀', '💥', '🔥', '😎', '🥳', '✨', '💯', '🌟', '🍕', '🌈', '⚡'];

    function correctMessage() {
      const pool = Math.random() < 0.6 ? priorityEmojis : funEmojis;
      const first = pool[Math.floor(Math.random() * pool.length)];
      let message = 'Correct! +1 point ' + first;
      if (Math.random() < 0.35) {
        message += ' ' + funEmojis[Math.floor(Math.random() * funEmojis.length)];
      }
      return message;
    }

    function submit() {
      if (!running || showingWork || answer === '') return;
      if (Number(answer) === current.result) {
        score++;
        setFeedback(correctMessage(), 'good');
        updateHud();
      } else {
        setFeedback('Not quite — it was ' + current.result + '.', 'bad');
      }
      clearAnswer();
      if (roundSeconds === 0) showWork();
      else generateQuestion();
    }

    function start() {
      setWorkVisible(false);
      score = 0;
      secondsLeft = roundSeconds;
      running = true;
      clearAnswer();
      generateQuestion();
      setFeedback('Go!');
      overlay.hidden = true;
      presetsEl.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      startBtn.disabled = roundSeconds > 0;
      startBtn.textContent = roundSeconds > 0 ? 'Start' : 'End round';
      updateHud();
      if (timerId) clearInterval(timerId);
      timerId = null;
      if (roundSeconds > 0) {
        deadline = performance.now() + roundSeconds * 1000;
        timerId = setInterval(tick, 200);
      }
    }

    function tick() {
      if (!running) return;
      const left = Math.max(0, Math.ceil((deadline - performance.now()) / 1000));
      if (left !== secondsLeft) { secondsLeft = left; updateHud(); }
      if (left === 0) endGame();
    }

    function endGame() {
      if (!running) return;
      running = false;
      if (timerId) clearInterval(timerId);
      timerId = null;
      secondsLeft = 0;
      setWorkVisible(false);
      clearAnswer();
      current = null;
      renderQuestion();

      if (score > best) {
        best = score;
        try { localStorage.setItem('math-best', String(best)); } catch (e) { /* storage unavailable */ }
        overlayTitle.textContent = 'New high score!';
      } else {
        overlayTitle.textContent = roundSeconds > 0 ? "Time's up!" : 'Round over';
      }
      overlayText.textContent = 'Score: ' + score + ' · Best: ' + best;
      updateHud();
      overlay.hidden = false;
      presetsEl.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      startBtn.disabled = false;
      startBtn.textContent = 'Start';
      againBtn.focus();
    }

    function stop() {
      running = false;
      if (timerId) clearInterval(timerId);
      timerId = null;
      setWorkVisible(false);
      clearAnswer();
      current = null;
      renderQuestion();
      setFeedback('Choose a round length and press Start.');
      overlay.hidden = true;
      presetsEl.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      startBtn.disabled = false;
      startBtn.textContent = 'Start';
      startBtn.focus();
    }

    function resetBest() {
      best = 0;
      try { localStorage.removeItem('math-best'); } catch (e) { /* storage unavailable */ }
      updateHud();
      if (!running && overlay.hidden) setFeedback('Best score reset.');
    }

    presetsEl.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-seconds]');
      if (b) selectPreset(Number(b.dataset.seconds));
    });

    startBtn.addEventListener('click', () => {
      if (running && roundSeconds === 0) endGame();
      else start();
    });
    againBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);
    resetBestBtn.addEventListener('click', resetBest);
    checkBtn.addEventListener('click', submit);
    nextBtn.addEventListener('click', nextQuestion);

    layoutBtn.addEventListener('click', () => {
      vertical = !vertical;
      layoutBtn.classList.toggle('selected', vertical);
      layoutBtn.setAttribute('aria-pressed', String(vertical));
      renderQuestion();
    });

    numpadEl.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-key]');
      if (!b) return;
      const key = b.dataset.key;
      if (showingWork) return;
      if (/^\d$/.test(key)) appendDigit(key);
      else if (key === 'back') backspace();
      else if (key === 'clear') clearAnswer();
    });

    document.addEventListener('keydown', (e) => {
      if (!running) {
        const onButton = e.target instanceof Element && e.target.closest('button');
        if ((e.key === 'Enter' || e.code === 'Space') && !onButton) {
          e.preventDefault();
          start();
        }
        return;
      }
      if (showingWork) {
        if (e.key === 'Enter' || e.code === 'Space') {
          e.preventDefault();
          nextQuestion();
        }
        return;
      }
      if (/^\d$/.test(e.key)) {
        e.preventDefault();
        appendDigit(e.key);
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        backspace();
      } else if (e.key === 'Delete' || e.key === 'Escape' || e.key.toLowerCase() === 'c') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        submit();
      }
    });

    selectPreset(0);
    bestEl.textContent = best;
  </script>
</body>
</html>
