<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A timed addition and subtraction game with an on-screen numpad and high scores." />
  <title>Math — Zee Site</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #4c8dff;
      --border: #30363d;
      --good: #3fb950;
      --bad: #f85149;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      padding: 1.5rem;
    }

    .brand { text-decoration: none; color: var(--text); font-weight: 700; font-size: 1.1rem; }
    .brand span { color: var(--accent); }
    .game-nav { display: flex; gap: 1.25rem; }
    .game-nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
    .game-nav a:hover { color: var(--text); }

    .hud {
      display: flex;
      gap: 2.5rem;
      font-variant-numeric: tabular-nums;
    }
    .hud .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .hud .value { font-size: 1.3rem; font-weight: 700; }
    .hud .best-cell { text-align: center; }

    .timebar { width: 100%; max-width: 420px; height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .timebar-fill { height: 100%; width: 100%; background: var(--accent); transition: width 0.2s linear; }

    .setup {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .setup-label { color: var(--muted); font-size: 0.85rem; }
    .presets { display: flex; gap: 0.4rem; }

    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 0.9rem;
      border-radius: var(--radius);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .preset.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; padding-inline: 1.6rem; }

    .board-wrap { position: relative; width: 100%; max-width: 420px; }

    .game {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .question {
      text-align: center;
      font-size: 2.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      padding: 0.4rem 0;
    }
    .question.vertical {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: max-content;
      margin-inline: auto;
      line-height: 1.1;
      padding: 0;
    }
    .question.vertical .v-row { padding-right: 0.35rem; }
    .question.vertical .v-rule { width: 100%; height: 2px; background: var(--text); margin: 0.15rem 0; }

    .answer-row { display: flex; gap: 0.6rem; }
    .answer {
      flex: 1;
      min-height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .answer.empty { color: var(--muted); font-weight: 400; }
    .check { min-width: 6.5rem; }

    .feedback { text-align: center; min-height: 1.3rem; font-size: 0.9rem; color: var(--muted); }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }

    .work {
      border-top: 1px solid var(--border);
      padding-top: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      text-align: left;
    }
    .work h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .break-grid {
      display: grid;
      grid-template-columns: repeat(4, auto);
      gap: 0.35rem 0.5rem;
      justify-content: center;
      align-items: center;
    }
    .break-grid .term, .break-grid .result { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .break-grid .op { font-size: 1.2rem; color: var(--muted); }
    .break-grid .target { color: var(--accent); }
    .down { grid-column: 3; width: 8rem; display: flex; flex-direction: column; align-items: center; }
    .down .stem { width: 2px; height: 10px; background: var(--border); }
    .down .arms { display: flex; width: 100%; }
    .down .arms i { flex: 1; position: relative; border-top: 2px solid var(--border); }
    .down .arms i::after { content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 9px; background: var(--border); }
    .down .boxes { display: flex; gap: 0.5rem; width: 100%; }
    .down .box { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.3rem 0.2rem; text-align: center; }
    .down .box b { display: block; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .down .box small { display: block; color: var(--muted); font-size: 0.6rem; letter-spacing: 0.08em; }
    .break-steps { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 0.15rem; margin-top: 0.2rem; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
    .break-steps .line { color: var(--muted); }
    .break-steps .line:last-child { color: var(--text); font-weight: 700; }
    .nl-svg { display: block; width: 100%; height: auto; }
    .nl-base, .nl-tick { stroke: var(--border); stroke-width: 2; }
    .nl-tick { stroke-width: 1.5; }
    .nl-dot { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
    .nl-dot.end { fill: var(--accent); }
    .nl-label { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .nl-label.end { fill: var(--accent); font-weight: 700; }
    .nl-arc { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .nl-arrow { fill: var(--border); }
    .nl-jump { fill: var(--text); font-size: 10px; text-anchor: middle; }
    .work-summary { color: var(--muted); font-size: 0.85rem; }
    .work .next { align-self: center; }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    .numpad button { height: 3.2rem; font-size: 1.1rem; }
    .numpad .fn { color: var(--muted); font-size: 1rem; }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      border-radius: var(--radius);
      text-align: center;
      padding: 1rem;
    }
    .overlay h2 { font-size: 1.6rem; }
    .overlay p { color: var(--muted); }

  </style>
</head>
<body>
  <a class="brand" href="index.html">Zee<span> Site</span> / Math</a>
  <nav class="game-nav">
    <a href="snake.html">Snake</a>
    <a href="plates.html">Plates</a>
  </nav>

  <div class="hud">
    <div><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="best-cell">
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
    </div>
    <div><div class="label">Time</div><div class="value" id="time">60</div></div>
  </div>

  <div class="timebar" id="timebar" aria-hidden="true"><div class="timebar-fill" id="timeFill"></div></div>

  <div class="setup">
    <span class="setup-label">Round length</span>
    <div class="presets" id="presets" role="group" aria-label="Round length">
      <button type="button" class="preset selected" data-seconds="60" aria-pressed="true">1 min</button>
      <button type="button" class="preset" data-seconds="120" aria-pressed="false">2 min</button>
      <button type="button" class="preset" data-seconds="300" aria-pressed="false">5 min</button>
      <button type="button" class="preset" data-seconds="0" aria-pressed="false">No timer</button>
    </div>
    <button type="button" id="startBtn" class="primary">Start</button>
    <span class="setup-label">Equation</span>
    <button type="button" id="layoutBtn" class="preset" aria-pressed="false" aria-label="Show equations vertically">Vertical</button>
  </div>

  <div class="board-wrap">
    <section class="game" id="game" aria-label="Math game">
      <div class="question" id="question" aria-live="polite">&#8212; + &#8212; = ?</div>

      <div class="answer-row">
        <div class="answer empty" id="answer" aria-label="Your answer">&#8212;</div>
        <button type="button" id="checkBtn" class="check">Check &#8629;</button>
      </div>

      <p class="feedback" id="feedback" aria-live="polite">Choose a round length and press Start.</p>

      <div class="work" id="work" hidden>
        <div>
          <h3>Break apart</h3>
          <div class="steps" id="workSteps"></div>
        </div>
        <div>
          <h3>Number line</h3>
          <div class="number-line" id="workLine"></div>
          <div class="work-summary" id="workSummary"></div>
        </div>
        <button type="button" id="nextBtn" class="primary next">Next question</button>
      </div>

      <div class="numpad" id="numpad">
        <button type="button" data-key="1" aria-label="Digit 1">1</button>
        <button type="button" data-key="2" aria-label="Digit 2">2</button>
        <button type="button" data-key="3" aria-label="Digit 3">3</button>
        <button type="button" data-key="4" aria-label="Digit 4">4</button>
        <button type="button" data-key="5" aria-label="Digit 5">5</button>
        <button type="button" data-key="6" aria-label="Digit 6">6</button>
        <button type="button" data-key="7" aria-label="Digit 7">7</button>
        <button type="button" data-key="8" aria-label="Digit 8">8</button>
        <button type="button" data-key="9" aria-label="Digit 9">9</button>
        <button type="button" class="fn" data-key="clear" aria-label="Clear answer">C</button>
        <button type="button" data-key="0" aria-label="Digit 0">0</button>
        <button type="button" class="fn" data-key="back" aria-label="Backspace">&#9003;</button>
      </div>
    </section>

    <div class="overlay" id="overlay" hidden>
      <h2 id="overlayTitle">Time's up!</h2>
      <p id="overlayText">Score: 0 &middot; Best: 0</p>
      <button type="button" id="againBtn" class="primary">Play again</button>
    </div>
  </div>


  <script>
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const timeEl = document.getElementById('time');
    const timebarEl = document.getElementById('timebar');
    const timeFill = document.getElementById('timeFill');
    const presetsEl = document.getElementById('presets');
    const startBtn = document.getElementById('startBtn');
    const layoutBtn = document.getElementById('layoutBtn');
    const questionEl = document.getElementById('question');
    const answerEl = document.getElementById('answer');
    const checkBtn = document.getElementById('checkBtn');
    const feedbackEl = document.getElementById('feedback');
    const workEl = document.getElementById('work');
    const workStepsEl = document.getElementById('workSteps');
    const workLineEl = document.getElementById('workLine');
    const workSummaryEl = document.getElementById('workSummary');
    const nextBtn = document.getElementById('nextBtn');
    const numpadEl = document.getElementById('numpad');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const againBtn = document.getElementById('againBtn');

    let best = 0;
    try {
      const stored = Number(localStorage.getItem('math-best') || 0);
      if (Number.isFinite(stored) && stored >= 0) best = stored;
    } catch (e) { /* storage unavailable */ }

    let roundSeconds = 60;
    let secondsLeft = 60;
    let score = 0;
    let running = false;
    let answer = '';
    let current = null;
    let lastKey = '';
    let deadline = 0;
    let timerId = null;
    let vertical = false;
    let showingWork = false;

    function updateHud() {
      scoreEl.textContent = score;
      bestEl.textContent = best;
      const untimed = roundSeconds === 0;
      timeEl.textContent = untimed ? '\u221E' : secondsLeft;
      timebarEl.hidden = untimed;
      if (!untimed) timeFill.style.width = (secondsLeft / roundSeconds * 100) + '%';
    }

    function selectPreset(seconds) {
      if (running) return;
      roundSeconds = seconds;
      secondsLeft = seconds;
      presetsEl.querySelectorAll('.preset').forEach((b) => {
        const on = Number(b.dataset.seconds) === seconds;
        b.classList.toggle('selected', on);
        b.setAttribute('aria-pressed', String(on));
      });
      updateHud();
    }

    function setFeedback(message, tone) {
      feedbackEl.textContent = message;
      feedbackEl.className = 'feedback' + (tone ? ' ' + tone : '');
    }

    function renderQuestion() {
      questionEl.classList.toggle('vertical', vertical && !!current);
      if (!current) {
        questionEl.textContent = '\u2014 + \u2014 = ?';
      } else if (vertical) {
        questionEl.innerHTML = '<span class="v-row">' + current.a + '</span>' +
          '<span class="v-row">' + current.op + ' ' + current.b + '</span>' +
          '<span class="v-rule"></span>' +
          '<span class="v-row">?</span>';
      } else {
        questionEl.textContent = current.a + ' ' + current.op + ' ' + current.b + ' = ?';
      }
    }

    function generateQuestion() {
      let q, key, tries = 0;
      do {
        const op = Math.random() < 0.5 ? '+' : '\u2212';
        let a = 10 + Math.floor(Math.random() * 90);
        let b;
        if (op === '+') {
          // Keep both operands two-digit and cap the sum at 109.
          b = 10 + Math.floor(Math.random() * (100 - a));
        } else {
          b = 10 + Math.floor(Math.random() * 90);
          if (a < b) { const t = a; a = b; b = t; }
        }
        q = { a: a, b: b, op: op, result: op === '+' ? a + b : a - b };
        key = a + op + b;
        tries++;
      } while (key === lastKey && tries < 10);
      lastKey = key;
      current = q;
      renderQuestion();
    }

    function clearAnswer() {
      answer = '';
      answerEl.textContent = '\u2014';
      answerEl.classList.add('empty');
    }

    function appendDigit(digit) {
      if (!running || showingWork || answer.length >= 3) return;
      answer += digit;
      answerEl.textContent = answer;
      answerEl.classList.remove('empty');
    }

    function backspace() {
      if (!running || showingWork) return;
      answer = answer.slice(0, -1);
      answerEl.textContent = answer || '\u2014';
      answerEl.classList.toggle('empty', answer === '');
    }

    function partsOf(n) {
      return { tens: Math.floor(n / 10) * 10, ones: n % 10 };
    }

    function workRow(text) {
      const row = document.createElement('div');
      row.className = 'line';
      row.textContent = text;
      return row;
    }

    function renderNumberLine(start, jumps, sign, end) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 400 140');
      svg.setAttribute('class', 'nl-svg');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'Open number line from ' + start + ' to ' + end);
      const add = (tag, attrs, text) => {
        const el = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, String(v)));
        if (text !== undefined) el.textContent = text;
        svg.appendChild(el);
        return el;
      };

      const count = jumps.length;
      const pad = 36;
      const dx = count ? (400 - pad * 2) / count : 0;
      const base = 100;
      const endX = pad + dx * count;
      const reverse = sign === '\u2212';
      const xAt = (i) => reverse ? pad + dx * (count - i) : pad + dx * i;

      add('line', { x1: pad - 20, y1: base, x2: endX + 12, y2: base, class: 'nl-base' });
      const tip = reverse ? pad - 18 : endX + 18;
      const back = reverse ? pad - 9 : endX + 9;
      add('polygon', {
        points: tip + ',' + base + ' ' + back + ',' + (base - 5) + ' ' + back + ',' + (base + 5),
        class: 'nl-arrow'
      });

      let value = start;
      for (let i = 0; i <= count; i++) {
        const x = xAt(i);
        const last = i === count;
        add('line', { x1: x, y1: base - 6, x2: x, y2: base + 6, class: 'nl-tick' });
        add('circle', { cx: x, cy: base, r: 4, class: 'nl-dot' + (last ? ' end' : '') });
        add('text', { x: x, y: 124, class: 'nl-label' + (last ? ' end' : ''), 'text-anchor': 'middle' }, String(value));
        if (i < count) {
          const nx = xAt(i + 1);
          const lift = i % 2 === 0 ? 42 : 60;
          add('path', {
            d: 'M ' + x + ' ' + base + ' C ' + x + ' ' + (base - lift) + ', ' + nx + ' ' + (base - lift) + ', ' + nx + ' ' + base,
            class: 'nl-arc'
          });
          add('text', { x: (x + nx) / 2, y: base - lift + 4, class: 'nl-jump' }, sign + jumps[i]);
          value += sign === '+' ? jumps[i] : -jumps[i];
        }
      }

      workLineEl.replaceChildren(svg);
    }

    function renderWork() {
      const { a, b, op, result } = current;
      const parts = partsOf(b);
      const steps = [];
      if (parts.tens) steps.push(parts.tens);
      if (parts.ones) steps.push(parts.ones);
      const jumps = [];
      for (let t = 0; t < parts.tens / 10; t++) jumps.push(10);
      for (let o = 0; o < parts.ones; o++) jumps.push(1);
      const sign = op === '+' ? '+' : '\u2212';

      workStepsEl.className = 'break-grid';
      workStepsEl.replaceChildren();
      const cell = (text, cls) => {
        const el = document.createElement('span');
        el.className = cls;
        el.textContent = text;
        workStepsEl.appendChild(el);
      };
      cell(String(a), 'term');
      cell(sign, 'op');
      cell(String(b), 'term target');
      cell('= ' + result, 'result');

      const down = document.createElement('div');
      down.className = 'down';
      const stem = document.createElement('div');
      stem.className = 'stem';
      down.appendChild(stem);
      const arms = document.createElement('div');
      arms.className = 'arms';
      arms.appendChild(document.createElement('i'));
      arms.appendChild(document.createElement('i'));
      down.appendChild(arms);
      const boxes = document.createElement('div');
      boxes.className = 'boxes';
      steps.forEach((value, idx) => {
        const box = document.createElement('div');
        box.className = 'box';
        const val = document.createElement('b');
        val.textContent = value;
        const label = document.createElement('small');
        label.textContent = idx === 0 && parts.tens ? 'TENS' : 'ONES';
        box.appendChild(val);
        box.appendChild(label);
        boxes.appendChild(box);
      });
      down.appendChild(boxes);
      workStepsEl.appendChild(down);

      const stepList = document.createElement('div');
      stepList.className = 'break-steps';
      stepList.appendChild(workRow(b + ' = ' + steps.join(' + ')));
      let prev = a;
      steps.forEach((step) => {
        const next = prev + (op === '+' ? step : -step);
        stepList.appendChild(workRow(prev + ' ' + sign + ' ' + step + ' = ' + next));
        prev = next;
      });
      workStepsEl.appendChild(stepList);

      renderNumberLine(a, jumps, sign, result);
      workSummaryEl.textContent = a + ' ' + op + ' ' + b + ' = ' + result;
    }

    function setWorkVisible(visible) {
      showingWork = visible;
      workEl.hidden = !visible;
      checkBtn.disabled = visible;
      numpadEl.querySelectorAll('button').forEach((b) => { b.disabled = visible; });
    }

    function showWork() {
      renderWork();
      setWorkVisible(true);
      nextBtn.focus();
    }

    function nextQuestion() {
      setWorkVisible(false);
      clearAnswer();
      generateQuestion();
      setFeedback('Go!');
    }

    function submit() {
      if (!running || showingWork || answer === '') return;
      if (Number(answer) === current.result) {
        score++;
        setFeedback('Correct! +1 point', 'good');
        updateHud();
      } else {
        setFeedback('Not quite — it was ' + current.result + '.', 'bad');
      }
      clearAnswer();
      if (roundSeconds === 0) showWork();
      else generateQuestion();
    }

    function start() {
      setWorkVisible(false);
      score = 0;
      secondsLeft = roundSeconds;
      running = true;
      clearAnswer();
      generateQuestion();
      setFeedback('Go!');
      overlay.hidden = true;
      presetsEl.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      startBtn.disabled = roundSeconds > 0;
      startBtn.textContent = roundSeconds > 0 ? 'Start' : 'End round';
      updateHud();
      if (timerId) clearInterval(timerId);
      timerId = null;
      if (roundSeconds > 0) {
        deadline = performance.now() + roundSeconds * 1000;
        timerId = setInterval(tick, 200);
      }
    }

    function tick() {
      if (!running) return;
      const left = Math.max(0, Math.ceil((deadline - performance.now()) / 1000));
      if (left !== secondsLeft) { secondsLeft = left; updateHud(); }
      if (left === 0) endGame();
    }

    function endGame() {
      if (!running) return;
      running = false;
      if (timerId) clearInterval(timerId);
      timerId = null;
      secondsLeft = 0;
      setWorkVisible(false);
      clearAnswer();
      current = null;
      renderQuestion();

      if (score > best) {
        best = score;
        try { localStorage.setItem('math-best', String(best)); } catch (e) { /* storage unavailable */ }
        overlayTitle.textContent = 'New high score!';
      } else {
        overlayTitle.textContent = roundSeconds > 0 ? "Time's up!" : 'Round over';
      }
      overlayText.textContent = 'Score: ' + score + ' · Best: ' + best;
      updateHud();
      overlay.hidden = false;
      presetsEl.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      startBtn.disabled = false;
      startBtn.textContent = 'Start';
      againBtn.focus();
    }

    presetsEl.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-seconds]');
      if (b) selectPreset(Number(b.dataset.seconds));
    });

    startBtn.addEventListener('click', () => {
      if (running && roundSeconds === 0) endGame();
      else start();
    });
    againBtn.addEventListener('click', start);
    checkBtn.addEventListener('click', submit);
    nextBtn.addEventListener('click', nextQuestion);

    layoutBtn.addEventListener('click', () => {
      vertical = !vertical;
      layoutBtn.classList.toggle('selected', vertical);
      layoutBtn.setAttribute('aria-pressed', String(vertical));
      renderQuestion();
    });

    numpadEl.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-key]');
      if (!b) return;
      const key = b.dataset.key;
      if (showingWork) return;
      if (/^\d$/.test(key)) appendDigit(key);
      else if (key === 'back') backspace();
      else if (key === 'clear') clearAnswer();
    });

    document.addEventListener('keydown', (e) => {
      if (!running) {
        const onButton = e.target instanceof Element && e.target.closest('button');
        if ((e.key === 'Enter' || e.code === 'Space') && !onButton) {
          e.preventDefault();
          start();
        }
        return;
      }
      if (showingWork) {
        if (e.key === 'Enter' || e.code === 'Space') {
          e.preventDefault();
          nextQuestion();
        }
        return;
      }
      if (/^\d$/.test(e.key)) {
        e.preventDefault();
        appendDigit(e.key);
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        backspace();
      } else if (e.key === 'Delete' || e.key === 'Escape' || e.key.toLowerCase() === 'c') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        submit();
      }
    });

    selectPreset(60);
    bestEl.textContent = best;
  </script>
</body>
</html>
