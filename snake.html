<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake — Zee Site</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #4c8dff;
      --border: #30363d;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
    }

    .brand { text-decoration: none; color: var(--text); font-weight: 700; font-size: 1.1rem; }
    .brand span { color: var(--accent); }
    .game-nav { display: flex; gap: 1.25rem; }
    .game-nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
    .game-nav a:hover { color: var(--text); }

    .hud {
      display: flex;
      gap: 2rem;
      font-variant-numeric: tabular-nums;
    }
    .hud .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .hud .value { font-size: 1.3rem; font-weight: 700; }
    .reset-best {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 0.1rem 0.4rem;
      margin-left: 0.4rem;
      font-size: 0.65rem;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }
    .reset-best:hover { opacity: 1; border-color: var(--accent); color: var(--text); }

    .board-wrap { position: relative; }

    canvas {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: block;
      max-width: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      border-radius: var(--radius);
      text-align: center;
      padding: 1rem;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 1.6rem; }
    .overlay p { color: var(--muted); }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.65rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }

    .hint { color: var(--muted); font-size: 0.85rem; text-align: center; }

    .settings-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem 1.5rem;
    }
    .mode-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-size: 0.9rem;
    }
    .mode-row button {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.4rem 1.1rem;
      font-size: 0.9rem;
    }
    .mode-row button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .touch {
      display: none;
      grid-template-areas:
        ". up ."
        "left down right";
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .touch button { width: 3.4rem; height: 3.4rem; font-size: 1.2rem; padding: 0; }
    .touch .up { grid-area: up; }
    .touch .down { grid-area: down; }
    .touch .left { grid-area: left; }
    .touch .right { grid-area: right; }

    @media (pointer: coarse) { .touch { display: grid; } }
  </style>
</head>
<body>
  <a class="brand" href="index.html">Zee<span> Site</span> / Snake</a>
  <nav class="game-nav">
    <a href="plates.html">Plates</a>
    <a href="plates-canada.html">Canada</a>
    <a href="math.html">Math</a>
  </nav>

  <div class="hud">
    <div><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div>
      <div class="label">Best <button id="resetBestBtn" class="reset-best" type="button" title="Reset best score">Reset</button></div>
      <div class="value" id="best">0</div>
    </div>
  </div>

  <div class="settings-row">
    <div class="mode-row">
      <span class="hint" style="margin:0">Mode:</span>
      <button id="modeBtn" type="button" aria-pressed="false">Normal</button>
    </div>
    <div class="mode-row">
      <span class="hint" style="margin:0">Speed:</span>
      <button class="speedBtn" type="button" data-speed="slow" aria-pressed="false">Slow</button>
      <button class="speedBtn" type="button" data-speed="medium" aria-pressed="true">Medium</button>
      <button class="speedBtn" type="button" data-speed="fast" aria-pressed="false">Fast</button>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="528" height="528" aria-label="Snake game board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Snake</h2>
      <p id="overlayText">Eat the food. Don't hit the walls or yourself.</p>
      <button id="startBtn">Play</button>
    </div>
  </div>

  <div class="touch">
    <button class="up"    data-dir="up">▲</button>
    <button class="left"  data-dir="left">◀</button>
    <button class="down"  data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>

  <p class="hint">Arrow keys or WASD to move · P to pause · Easy mode waits for a new direction at obstacles</p>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const resetBestBtn = document.getElementById('resetBestBtn');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');
    const modeBtn = document.getElementById('modeBtn');

    const GRID = 20;                 // cells per side
    const CELL = canvas.width / GRID;
    // Step timing for each speed setting; Medium is the default (the previous speed)
    const SPEEDS = {
      slow:   { start: 300, min: 170, step: 2 },
      medium: { start: 210, min: 110, step: 2 },
      fast:   { start: 140, min: 65,  step: 4 }
    };

    const COLORS = {
      head: '#4c8dff',
      body: '#3a6fd0',
      food: '#f85149',
      eye: '#ffffff',
      text: '#e6edf3',
      muted: '#8b949e'
    };

    let snake, prevSnake, dir, nextDir, food, score, best, stepMs, lastStep, running, paused, dead, waiting;
    // Easy mode: obstacles pause instead of ending the run (remembered between visits)
    let easyMode = localStorage.getItem('snake-easy') === '1';

    const savedSpeed = localStorage.getItem('snake-speed');
    let speed = Object.prototype.hasOwnProperty.call(SPEEDS, savedSpeed) ? savedSpeed : 'medium';

    function syncModeBtn() {
      modeBtn.textContent = easyMode ? 'Easy' : 'Normal';
      modeBtn.setAttribute('aria-pressed', String(easyMode));
      if (!running) {
        overlayText.textContent = easyMode
          ? 'Eat the food. Obstacles pause instead of ending the game.'
          : "Eat the food. Don't hit the walls or yourself.";
      }
    }

    function syncSpeedBtns() {
      document.querySelectorAll('.speedBtn').forEach((btn) => {
        btn.setAttribute('aria-pressed', String(btn.dataset.speed === speed));
      });
    }

    function applySpeed() {
      const s = SPEEDS[speed];
      stepMs = Math.max(s.min, s.start - score * s.step);
    }

    best = Number(localStorage.getItem('snake-best') || 0);
    bestEl.textContent = best;

    function reset() {
      const mid = Math.floor(GRID / 2);
      snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
      dir = { x: 1, y: 0 };
      nextDir = dir;
      score = 0;
      applySpeed();
      dead = false;
      paused = false;
      waiting = false;
      prevSnake = snake.map(s => ({ ...s }));
      placeFood();
      updateHud();
      lastStep = performance.now();
    }

    function placeFood() {
      while (true) {
        const f = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
        if (!snake.some(s => s.x === f.x && s.y === f.y)) {
          food = f;
          return;
        }
      }
    }

    function updateHud() {
      scoreEl.textContent = score;
      bestEl.textContent = best;
    }

    function isBlocked(nx, ny) {
      const hx = snake[0].x + nx;
      const hy = snake[0].y + ny;
      if (hx < 0 || hy < 0 || hx >= GRID || hy >= GRID) return true;
      return snake.some(s => s.x === hx && s.y === hy);
    }

    function hasClearDirection() {
      return [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([x, y]) =>
        !(dir.x === -x && dir.y === -y) && !isBlocked(x, y));
    }

    function setDir(nx, ny) {
      // Prevent reversing into yourself
      if (dir.x === -nx && dir.y === -ny) return;
      if (waiting) {
        // While waiting at an obstacle, only a direction that actually clears it resumes play
        if (isBlocked(nx, ny)) return;
        waiting = false;
        prevSnake = snake.map(s => ({ ...s }));
        lastStep = performance.now();
      }
      nextDir = { x: nx, y: ny };
    }

    function step(now) {
      requestAnimationFrame(step);
      if (!running || paused || dead || waiting) return;
      if (now - lastStep < stepMs) return;

      // Check the upcoming cell before committing the move
      if (isBlocked(nextDir.x, nextDir.y)) {
        if (easyMode) {
          waiting = true;   // pause in place until the player picks a clear direction
          if (!hasClearDirection()) {
            showOverlay('Trapped!', 'No open direction — start a new game.', 'Restart');
          }
          return;
        }
        return gameOver();
      }

      lastStep = now;
      prevSnake = snake.map(s => ({ ...s }));
      dir = nextDir;

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        // Speed up gradually as the snake grows
        applySpeed();
        if (score > best) {
          best = score;
          localStorage.setItem('snake-best', best);
        }
        placeFood();
        updateHud();
      } else {
        snake.pop();
      }
    }

    function gameOver() {
      dead = true;
      showOverlay('Game over', `Score: ${score} · Best: ${best}`, 'Play again');
    }

    function showOverlay(title, text, btn) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      startBtn.textContent = btn;
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function draw() {
      requestAnimationFrame(draw);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height);
        ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      const now = performance.now();

      // Food with a gentle pulse
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      ctx.fillStyle = COLORS.food;
      ctx.beginPath();
      ctx.arc(fx, fy, CELL * (0.30 + 0.025 * Math.sin(now / 220)), 0, Math.PI * 2);
      ctx.fill();

      // How far through the current step are we? 0 = previous cell, 1 = current cell.
      const alpha = (running && !paused && !dead && !waiting)
        ? Math.min(1, (now - lastStep) / stepMs)
        : 1;

      let headGx = snake[0].x, headGy = snake[0].y;

      // Snake — interpolate each segment between its previous and current cell
      for (let i = snake.length - 1; i >= 0; i--) {
        const cur = snake[i];
        const prev = prevSnake[Math.min(i, prevSnake.length - 1)] || cur;
        const gx = prev.x + (cur.x - prev.x) * alpha;
        const gy = prev.y + (cur.y - prev.y) * alpha;
        if (i === 0) { headGx = gx; headGy = gy; }

        ctx.fillStyle = i === 0 ? COLORS.head : COLORS.body;
        const pad = i === 0 ? 2.4 : 3.6;
        const r = 4.8;
        const x = gx * CELL + pad, y = gy * CELL + pad;
        const w = CELL - pad * 2, h = CELL - pad * 2;
        roundRect(x, y, w, h, r);
        ctx.fill();
      }

      // Eyes on the head
      const ex = headGx * CELL + CELL / 2 + dir.x * CELL * 0.18;
      const ey = headGy * CELL + CELL / 2 + dir.y * CELL * 0.18;
      const off = CELL * 0.16;
      const e1 = dir.x !== 0 ? { x: ex, y: ey - off } : { x: ex - off, y: ey };
      const e2 = dir.x !== 0 ? { x: ex, y: ey + off } : { x: ex + off, y: ey };
      ctx.fillStyle = COLORS.eye;
      for (const e of [e1, e2]) {
        ctx.beginPath();
        ctx.arc(e.x, e.y, CELL * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }

      // Easy mode: the snake stopped at an obstacle, prompt for a new direction
      if (waiting) {
        ctx.fillStyle = 'rgba(13, 17, 23, 0.72)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';
        ctx.fillStyle = COLORS.text;
        ctx.font = '700 31px system-ui, sans-serif';
        ctx.fillText('Blocked!', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = COLORS.muted;
        ctx.font = '18px system-ui, sans-serif';
        ctx.fillText('Press a new direction to keep going', canvas.width / 2, canvas.height / 2 + 26);
        ctx.textAlign = 'start';
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function start() {
      reset();
      running = true;
      hideOverlay();
    }

    function togglePause() {
      if (!running || dead || waiting) return;
      paused = !paused;
      if (paused) showOverlay('Paused', 'Press P or the button to resume', 'Resume');
      else hideOverlay();
    }

    const KEYS = {
      ArrowUp: 'up', KeyW: 'up',
      ArrowDown: 'down', KeyS: 'down',
      ArrowLeft: 'left', KeyA: 'left',
      ArrowRight: 'right', KeyD: 'right'
    };
    const DIRS = {
      up: [0, -1], down: [0, 1],
      left: [-1, 0], right: [1, 0]
    };

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyP') { togglePause(); return; }
      if (e.code === 'Space' || e.code === 'Enter') {
        if (!running || dead || (waiting && !overlay.classList.contains('hidden'))) {
          e.preventDefault();
          start();
        }
        return;
      }
      const d = KEYS[e.code];
      if (d) {
        e.preventDefault();
        const [nx, ny] = DIRS[d];
        setDir(nx, ny);
      }
    });

    document.querySelectorAll('.touch [data-dir]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const [nx, ny] = DIRS[btn.dataset.dir];
        setDir(nx, ny);
      });
    });

    startBtn.addEventListener('click', () => {
      if (paused) togglePause();
      else start();
    });

    resetBestBtn.addEventListener('click', () => {
      best = 0;
      localStorage.removeItem('snake-best');
      updateHud();
    });

    modeBtn.addEventListener('click', () => {
      easyMode = !easyMode;
      localStorage.setItem('snake-easy', easyMode ? '1' : '0');
      syncModeBtn();
      // Leaving easy mode while blocked: the next step will apply normal collision rules
      if (!easyMode && waiting) {
        waiting = false;
        lastStep = performance.now();
        hideOverlay();
      }
    });

    document.querySelectorAll('.speedBtn').forEach((btn) => {
      btn.addEventListener('click', () => {
        speed = btn.dataset.speed;
        localStorage.setItem('snake-speed', speed);
        syncSpeedBtns();
        applySpeed();
        lastStep = performance.now();   // avoid an immediate catch-up step
      });
    });

    // Init
    syncModeBtn();
    syncSpeedBtns();
    reset();
    running = false;
    requestAnimationFrame(step);
    requestAnimationFrame(draw);
  </script>
</body>
</html>
